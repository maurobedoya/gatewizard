<div class="md-social">
  {% for social in config.extra.social %}
    {% set rel = "noopener" %}
    {% if "mastodon" in social.icon %}
      {% set rel = rel ~ " me" %}
    {% endif %}
    <a href="{{ social.link }}" target="_blank" rel="{{ rel }}" title="{{ social.name | e }}" class="md-social__link">
      {% include ".icons/" ~ social.icon ~ ".svg" %}
      {% if social.name %}
        <span class="md-social__name">{{ social.name }}</span>
      {% endif %}
    </a>
  {% endfor %}
</div>
