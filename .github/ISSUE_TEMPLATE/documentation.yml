name: Documentation
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Docs live at [maurobedoya.github.io/gatewizard](https://maurobedoya.github.io/gatewizard/). For how-to questions, use [Discussions](https://github.com/maurobedoya/gatewizard/discussions).

  - type: input
    id: page
    attributes:
      label: Page or section
      description: URL or path (e.g. `docs/api/preparation.md`, User Guide → Preparation)
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional — wording, example, or structure you would find helpful.
