name: gatewizard
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.8
  - ambertools=24
  - parmed=4.3.0  # Must be from conda-forge for compatibility with AmberTools
  - propka
  - matplotlib>=3.5.0
  - requests>=2.25.0
  - rdkit  # For ligand 2D structure visualization
  - pillow>=9.0.0  # For image display in GUI
  - openmm>=8.0
  - cudatoolkit  # OpenMM CUDA platform (Linux/WSL); use with NVIDIA driver
  # GROMACS (optional but recommended for equilibration). Prefer CPU in this env:
  #   conda install -c conda-forge gromacs
  # CUDA build (Linux, often conflicts with OpenMM/cudatoolkit — can hang in the solver):
  #   conda install -c conda-forge 'gromacs=*=nompi_cuda*'
  # gatewizard-gui defaults to CPU GROMACS; set GATEWIZARD_CONDA_GROMACS_CUDA=1 to opt in.
  # See docs/installation.md - GROMACS: CPU vs CUDA.
  - gromacs
  - pip
  - pip:
    - -e .[full]
