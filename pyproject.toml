[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gatewizard"
version = "1.0.45"
description = "A tool for membrane protein preparation and molecular dynamics analysis"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Constanza González", email = "constanza.gonzalez.villagra@gmail.com"},
    {name = "Mauricio Bedoya", email = "mbedoya@ucm.cl"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "requests>=2.25.0",
    "MDAnalysis>=2.0.0",
    "lipyphilic>=0.12.0",
    "propka>=3.2.0",
    "Pillow>=9.0.0",
    "rdkit>=2023.3.1",
    "psique>=1.2.1",
]

[project.optional-dependencies]
md = [
    "parmed>=4.3.0",
    "openmm>=8.0",
]
# MemPrO cannot be listed here: PyPI rejects VCS/direct URL dependencies in metadata.
# Install from GitHub after gatewizard[orientation] or gatewizard[full]:
#   pip install -r requirements-orientation.txt
orientation = []
full = [
    "parmed>=4.3.0",
    "openmm>=8.0",
]

[tool.setuptools]
packages = {find = {}}

[tool.setuptools.package-data]
gatewizard = ["**/*.yml", "**/*.yaml", "**/*.json", "**/*.txt", "**/*.pdb", "tools/psique"]
equilibration = ["**/*.inp", "**/*.mdp", "**/*.py"]

[tool.pytest.ini_options]
# Filter out expected warnings from dependencies
filterwarnings = [
    # Ignore MDAnalysis PDB loading warnings (expected for test files without full metadata)
    "ignore:Unit cell dimensions not found:UserWarning:MDAnalysis.coordinates.PDB",
    "ignore:1 A\\^3 CRYST1 record:UserWarning:MDAnalysis.coordinates.PDB",
    "ignore:Found no information for attr:UserWarning:MDAnalysis.coordinates.PDB",
    "ignore:Element information is missing:UserWarning:MDAnalysis.topology.PDBParser",
    # Ignore MDAnalysis DCDReader deprecation (will be resolved in MDAnalysis 3.0)
    "ignore:DCDReader currently makes independent timesteps:DeprecationWarning:MDAnalysis.coordinates.DCD",
    # Ignore numpy compatibility warning from parmed
    "ignore:`np.compat`:DeprecationWarning:parmed.utils.netcdf",
    # Ignore matplotlib deprecation warning (will be fixed in future matplotlib update)
    "ignore:The 'labels' parameter of boxplot.*:DeprecationWarning",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
