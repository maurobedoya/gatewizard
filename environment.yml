name: gatewizard
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.8
  - ambertools=24
  - parmed=4.3.0  # Must be from conda-forge for compatibility with AmberTools
  - propka
  - matplotlib>=3.5.0
  - requests>=2.25.0
  - rdkit  # For ligand 2D structure visualization
  - pillow>=9.0.0  # For image display in GUI
  - openmm>=8.0
  - cudatoolkit  # OpenMM CUDA platform (Linux/WSL); use with NVIDIA driver
  # GROMACS (optional but recommended for equilibration). One build per env:
  # Linux CUDA:  conda install 'gromacs=*=nompi_cuda*' -c conda-forge
  # CPU fallback: conda install gromacs -c conda-forge
  # The GUI micromamba bootstrap tries CUDA then CPU automatically.
  - gromacs
  - pip
  - pip:
    - -e .[full]
