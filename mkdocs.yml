# GitHub Pages Configuration for MkDocs
site_name: GateWizard Documentation
site_description: A tool for membrane protein preparation, molecular dynamics simulation setting, run and analysis
site_author: Constanza González, Mauricio Bedoya
site_url: https://maurobedoya.github.io/gatewizard/

# Repository
repo_name: gatewizard
repo_url: https://github.com/maurobedoya/gatewizard
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 Constanza González, Mauricio Bedoya

# Theme
theme:
  name: material
  variant: classic
  custom_dir: overrides
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky  # Keep tabs visible when scrolling
    - navigation.indexes      # Enable section index pages
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - toc.follow              # Sidebar table of contents follows scroll
    - toc.integrate
  logo: images/logo.png
  favicon: images/favicon.png
  icon:
    repo: fontawesome/brands/github

# Navigation
nav:
  - Home: index.md
  - Installation: installation.md
  - User Guide: user-guide.md
  - Analysis: analysis.md
  - Study cases: study-cases/index.md
  - Troubleshooting: troubleshooting.md
  - API:
      - Overview: api/index.md
      - Method dictionary: api/dictionary.md
      - Structure Manager: api/structure_manager.md
      - Biological assembly: api/assembly.md
      - Preparation Module: api/preparation.md
      - Builder Module: api/builder.md
      - MemPrO Module: api/mempro.md
      - Hydration Module: api/hydration.md
      - Equilibration: api/equilibration.md
      - Analysis: api/analysis.md
      - Quick Reference: QUICK_REFERENCE.md

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# Plugins
plugins:
  - search
  - minify:
      minify_html: true

# Extra
extra:
  repositories:
    - name: API
      repo: maurobedoya/gatewizard
      url: https://github.com/maurobedoya/gatewizard
    - name: GUI
      repo: franciscoadasme/gatewizard-gui
      url: https://github.com/franciscoadasme/gatewizard-gui
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/maurobedoya/gatewizard
      name: API
    - icon: fontawesome/brands/github
      link: https://github.com/franciscoadasme/gatewizard-gui
      name: GUI
    - icon: fontawesome/brands/github
      link: https://github.com/maurobedoya/gatewizard/discussions
      name: Discussions
  version:
    provider: mike

# CSS
extra_css:
  - stylesheets/extra.css

# JavaScript
extra_javascript:
  - javascripts/repos.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
